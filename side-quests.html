<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Side Quests — Shawn Wei Chew</title>
    <meta
      name="description"
      content="Paddling photos and other non-technical things."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---- palette (Rust) -------------------------------------------------- */
      :root {
        --bg: #12100f;
        --fg: #e6dfd9;
        --dim: #8c827b;
        --line: #282320;
        --accent: #e0524f;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 42rem;
        margin: 0 auto;
        padding: 5rem 1.5rem 4rem;
      }

      p {
        margin: 0 0 1.15rem;
      }

      a {
        color: var(--fg);
        text-decoration: none;
        border-bottom: 1px solid var(--accent);
        padding-bottom: 1px;
      }

      a:hover {
        color: var(--accent);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 2px;
      }

      /* ---- post pages ------------------------------------------------------ */
      .back {
        display: inline-block;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.8rem;
        color: var(--dim);
        border-bottom-color: transparent;
        margin-bottom: 2.5rem;
      }

      .back:hover {
        color: var(--accent);
      }

      .post-title {
        font-size: 1.55rem;
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.3;
        margin: 0 0 0.4rem;
      }

      .post-date {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.8rem;
        color: var(--dim);
        margin-bottom: 2.5rem;
      }

      h2 {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--accent);
        margin: 2.75rem 0 1rem;
      }

      /* ---- photo gallery ----------------------------------------------------- */
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 0.6rem;
      }

      .gallery figure {
        margin: 0;
      }

      .gallery img {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 2;
        object-fit: cover;
        border-radius: 3px;
        background: var(--line);
      }

      @media (max-width: 560px) {
        .page {
          padding-top: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="back" href="index.html">&larr; Back</a>

      <h1 class="post-title">Side Quests</h1>

      <h2>Flowers</h2>
      <p>Flowers spark some inexplicable joy in me</p>
      <div class="gallery">
        <figure>
          <img
            src="assets/poppies-elizabeth-lake.jpeg"
            alt="Poppies at Elizabeth Lake"
            loading="lazy"
          />
        </figure>
        <figure>
          <img
            src="assets/sakura-ucla.jpeg"
            alt="Sakura at UCLA"
            loading="lazy"
          />
        </figure>
      </div>

      <h2>Kayaking</h2>
      <p>I used to paddle A LOT</p>
      <div class="gallery">
        <figure>
          <img
            src="assets/paddling-1.jpg"
            alt="Shawn paddling"
            loading="lazy"
          />
        </figure>
        <figure>
          <img
            src="assets/paddling-2.jpg"
            alt="Shawn paddling"
            loading="lazy"
          />
        </figure>
      </div>
    </main>
  </body>
</html>
